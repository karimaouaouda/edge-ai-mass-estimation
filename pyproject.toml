[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ai-mass"
version = "0.1.3"
description = "Edge AI system for waste object characterization and mass estimation"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics>=8.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "Pillow>=10.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "tqdm>=4.65",
]

[project.optional-dependencies]
depth = [
    "transformers>=4.35",
    "timm>=0.9",
]
tensorrt = [
    "tensorrt>=8.6",
    "pycuda>=2022.2",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.4",
]
data = [
    "albumentations>=1.3",
    "fiftyone>=0.22",
    "roboflow>=1.1",
]
eval = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "tensorboard>=2.14",
]
tabular = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
]
mlops = [
    "mlflow>=2.14",
    "zenml>=0.95,<0.96",
    "dvc>=3.50",
    "pandas>=2.0",
    "joblib>=1.3",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "optuna>=4.0",
]
orchestration = [
    "kaggle>=2.2.2",
    "paho-mqtt>=2.1",
    "psutil>=5.9",
]
webrtc = [
    "aiortc>=1.9",
    "av>=12",
]
directml = [
    "torch-directml",
]
host = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
all = ["edge-ai-mass[depth,dev,data,eval,tabular,mlops,orchestration,webrtc,directml,host]"]

[project.scripts]
edge-ai-mass = "edge_ai_mass.cli:main"
edge-ai-orchestrator = "edge_ai_mass.orchestration.start:main"
test-cmd = "test_cmd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
