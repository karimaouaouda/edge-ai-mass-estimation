# Backend-facing Jetson device agent configuration.
# Run with: edge-ai-mass agent --config configs/agent/jetson_nano.yaml

device:
  id: ${EDGE_AI_DEVICE_ID:jetson-nano}
  name: ${EDGE_AI_DEVICE_NAME:Jetson Nano}
  type: jetson_nano
  firmware_version: ${EDGE_AI_FIRMWARE_VERSION:unknown}
  agent_version: ${EDGE_AI_AGENT_VERSION:0.1.0}
  capabilities:
    inference: true
    preview: true
    model_update: true
  active_models:
    detector: ${EDGE_AI_ACTIVE_DETECTOR_VERSION:yolo-waste-v1}
    depth: ${EDGE_AI_ACTIVE_DEPTH_VERSION:depth-v1}
    mass: ${EDGE_AI_ACTIVE_MASS_VERSION:mass-v1}

backend:
  base_url: ${DROVENAI_BACKEND_URL:http://localhost:8000}
  device_token_env: DROVENAI_DEVICE_TOKEN
  request_timeout_seconds: ${DROVENAI_BACKEND_TIMEOUT_SECONDS:10}
  max_retries: ${DROVENAI_BACKEND_MAX_RETRIES:3}
  retry_backoff_seconds: ${DROVENAI_BACKEND_RETRY_BACKOFF_SECONDS:0.5}

mqtt:
  host: ${DROVENAI_MQTT_HOST:127.0.0.1}
  port: ${DROVENAI_MQTT_PORT:1883}
  topic_prefix: ${MQTT_TOPIC_PREFIX:drovenai}
  username_env: DROVENAI_MQTT_USERNAME
  password_env: DROVENAI_MQTT_PASSWORD
  tls: ${DROVENAI_MQTT_TLS:false}
  keepalive_seconds: ${DROVENAI_MQTT_KEEPALIVE_SECONDS:30}
  client_id: ${DROVENAI_MQTT_CLIENT_ID:jetson-nano-agent}
  qos: ${DROVENAI_MQTT_QOS:0}

runtime:
  telemetry_interval_seconds: ${DROVENAI_TELEMETRY_INTERVAL_SECONDS:30}
  # http remains the default; mqtt uses the backend mqtt:consume telemetry path.
  telemetry_transport: ${DROVENAI_TELEMETRY_TRANSPORT:http}
  # aiortc sends real camera frames; simulated is only for local contract tests.
  preview_backend: ${DROVENAI_PREVIEW_BACKEND:aiortc}
  media_upload_retries: ${DROVENAI_MEDIA_UPLOAD_RETRIES:5}
  outbox_path: ${DROVENAI_OUTBOX_PATH:.edge_ai_mass/agent/outbox}
  model_dir: ${DROVENAI_MODEL_DIR:.edge_ai_mass/agent/models}
  media_dir: ${DROVENAI_MEDIA_DIR:.edge_ai_mass/agent/media}
  pipeline_config: ${EDGE_AI_PIPELINE_CONFIG:configs/pipeline/jetson_nano.yaml}
  camera_source: ${EDGE_AI_CAMERA_SOURCE:camera:0}
  outbox_max_attempts: ${DROVENAI_OUTBOX_MAX_ATTEMPTS:8}
  outbox_retention_seconds: ${DROVENAI_OUTBOX_RETENTION_SECONDS:604800}
