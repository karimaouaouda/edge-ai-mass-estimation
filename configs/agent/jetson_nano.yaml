# Backend-facing Jetson device agent configuration.
# Run with: edge-ai-mass agent --config configs/agent/jetson_nano.yaml

device:
  id: ${EDGE_AI_DEVICE_ID:jetson-nano}
  name: ${EDGE_AI_DEVICE_NAME:Jetson Nano}
  type: jetson_nano
  firmware_version: ${EDGE_AI_FIRMWARE_VERSION:unknown}
  agent_version: ${EDGE_AI_AGENT_VERSION:0.1.3}
  capabilities:
    inference: true
    preview: true
    model_update: true
  active_models:
    detector: ${EDGE_AI_ACTIVE_DETECTOR_VERSION:yolo-waste-v1}
    depth: ${EDGE_AI_ACTIVE_DEPTH_VERSION:depth-v1}
    mass: ${EDGE_AI_ACTIVE_MASS_VERSION:mass-v1}

backend:
  base_url: ${DROVENAI_BACKEND_URL:http://localhost:8000}
  device_token_env: DROVENAI_DEVICE_TOKEN
  request_timeout_seconds: ${DROVENAI_BACKEND_TIMEOUT_SECONDS:10}
  max_retries: ${DROVENAI_BACKEND_MAX_RETRIES:3}
  retry_backoff_seconds: ${DROVENAI_BACKEND_RETRY_BACKOFF_SECONDS:0.5}

host_inference:
  # Optional host-side primary-model execution provider. The edge pipeline still
  # loads and tries its local primary first. If that primary fails, the agent
  # pings the matching host stage endpoint; if the host is healthy it runs that
  # host primary before using the local edge fallback.
  enabled: ${EDGE_AI_HOST_INFERENCE_ENABLED:false}
  scheme: ${EDGE_AI_HOST_INFERENCE_SCHEME:http}
  host: ${EDGE_AI_HOST_INFERENCE_HOST:127.0.0.1}
  port: ${EDGE_AI_HOST_INFERENCE_PORT:8090}
  # Optional full URL override, e.g. http://gpu-host.local:8090
  base_url: ${EDGE_AI_HOST_INFERENCE_BASE_URL:}
  request_timeout_seconds: ${EDGE_AI_HOST_INFERENCE_TIMEOUT_SECONDS:15}
  health_timeout_seconds: ${EDGE_AI_HOST_INFERENCE_HEALTH_TIMEOUT_SECONDS:2}
  # Used for explicit host load/smoke-test requests and for the first hosted
  # inference call when the health ping reports that the remote primary is not
  # loaded yet. Depth models can need this much time on first download/startup.
  load_timeout_seconds: ${EDGE_AI_HOST_INFERENCE_LOAD_TIMEOUT_SECONDS:180}
  stages:
    detection:
      enabled: ${EDGE_AI_HOST_INFERENCE_DETECTION_ENABLED:true}
      endpoint_stage: detection
    depth:
      enabled: ${EDGE_AI_HOST_INFERENCE_DEPTH_ENABLED:true}
      endpoint_stage: depth
    mass:
      enabled: ${EDGE_AI_HOST_INFERENCE_MASS_ENABLED:true}
      endpoint_stage: mass

mqtt:
  host: ${DROVENAI_MQTT_HOST:127.0.0.1}
  port: ${DROVENAI_MQTT_PORT:1883}
  topic_prefix: ${MQTT_TOPIC_PREFIX:drovenai}
  username_env: DROVENAI_MQTT_USERNAME
  password_env: DROVENAI_MQTT_PASSWORD
  tls: ${DROVENAI_MQTT_TLS:false}
  keepalive_seconds: ${DROVENAI_MQTT_KEEPALIVE_SECONDS:30}
  client_id: ${DROVENAI_MQTT_CLIENT_ID:jetson-nano-agent}
  qos: ${DROVENAI_MQTT_QOS:0}

updates:
  enabled: ${DROVENAI_AUTO_UPDATE_ENABLED:true}
  config_path: ${EDGE_AI_ORCHESTRATOR_CONFIG:configs/orchestration/jetson_nano.yaml}
  run_on_start: ${DROVENAI_AUTO_UPDATE_RUN_ON_START:true}
  poll_interval_seconds: ${DROVENAI_AUTO_UPDATE_INTERVAL_SECONDS:21600}
  target: ${DROVENAI_AUTO_UPDATE_TARGET:all}
  force: ${DROVENAI_AUTO_UPDATE_FORCE:false}
  release_tag: ${DROVENAI_AUTO_UPDATE_RELEASE_TAG:}

runtime:
  telemetry_interval_seconds: ${DROVENAI_TELEMETRY_INTERVAL_SECONDS:30}
  # http remains the default; mqtt uses the backend mqtt:consume telemetry path.
  telemetry_transport: ${DROVENAI_TELEMETRY_TRANSPORT:http}
  # aiortc sends real camera frames; simulated is only for local contract tests.
  preview_backend: ${DROVENAI_PREVIEW_BACKEND:aiortc}
  media_upload_retries: ${DROVENAI_MEDIA_UPLOAD_RETRIES:5}
  outbox_path: ${DROVENAI_OUTBOX_PATH:.edge_ai_mass/agent/outbox}
  model_dir: ${DROVENAI_MODEL_DIR:.edge_ai_mass/agent/models}
  media_dir: ${DROVENAI_MEDIA_DIR:.edge_ai_mass/agent/media}
  pipeline_config: ${EDGE_AI_PIPELINE_CONFIG:configs/pipeline/jetson_nano.yaml}
  # Load Torch/TensorRT and all configured models before the MQTT thread starts.
  preload_inference: ${DROVENAI_PRELOAD_INFERENCE:true}
  camera_source: ${EDGE_AI_CAMERA_SOURCE:camera:0}
  outbox_max_attempts: ${DROVENAI_OUTBOX_MAX_ATTEMPTS:8}
  outbox_retention_seconds: ${DROVENAI_OUTBOX_RETENTION_SECONDS:604800}
