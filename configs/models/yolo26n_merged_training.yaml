# YOLO26n-seg training configuration for the merged TACO + AquaTrash dataset.

model: yolo26n-seg.pt
data: data/processed/taco_aquatrash_yolo_seg/dataset.yaml
epochs: 50
batch: 16
imgsz: 640
patience: 20
device: 0

# Augmentation
augment: true
mosaic: 1.0
mixup: 0.1
copy_paste: 0.3

# Optimizer
optimizer: AdamW
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005

# Save
project: runs/train
name: yolo26n-seg-taco-aquatrash

# MLflow + Optuna
experiment_name: waste-seg-yolo26n-merged
mlflow_config: configs/mlflow.yaml
optuna_trials: 10
tune_epochs: 12
optuna_direction: maximize
optuna_metric: mask_map50_95
