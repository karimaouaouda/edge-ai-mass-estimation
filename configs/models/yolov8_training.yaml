# YOLOv8 training configuration for waste detection
# Use with: yolo detect train cfg=configs/models/yolov8_training.yaml

model: yolov8n-seg.pt
data: data/waste_dataset.yaml
epochs: 100
batch: 16
imgsz: 640
patience: 20
device: 0

# Augmentation
augment: true
mosaic: 1.0
mixup: 0.1
copy_paste: 0.3

# Optimiser
optimizer: AdamW
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005

# Save
project: runs/train
name: yolov8n-seg-waste
