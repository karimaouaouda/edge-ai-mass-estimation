# Jetson Nano optimised configuration
# Tighter latency budgets, smaller models, TensorRT engines.

calibration:
  path: ${EDGE_AI_CALIBRATION_PATH:}
  required: false
  undistort: false

depth_scale:
  output_type: ${EDGE_AI_DEPTH_OUTPUT_TYPE:metric}
  scale: ${EDGE_AI_DEPTH_SCALE:1.0}
  offset: ${EDGE_AI_DEPTH_OFFSET:0.0}
  min_depth_m: 0.01
  max_depth_m: 10.0
  calibration_id: ${EDGE_AI_DEPTH_SCALE_ID:jetson-depth-scale}

background:
  depth_path: ${EDGE_AI_BACKGROUND_DEPTH_PATH:}
  metric: true
  required: false
  depth_m: ${EDGE_AI_BACKGROUND_DEPTH_M:1.0}
  background_id: ${EDGE_AI_BACKGROUND_ID:jetson-background}

geometry:
  enabled: true
  pixel_to_m: ${EDGE_AI_PIXEL_TO_M:0.001}
  default_thickness_m: ${EDGE_AI_DEFAULT_THICKNESS_M:0.01}
  min_height_m: 0.0
  max_height_m: 1.0
  height_mode: background_minus_object

stages:
  detection:
    latency_budget_ms: 120
    # Keep valid segmentation masks even when Jetson inference exceeds the target latency.
    fallback_on_latency_exceeded: false
    primary:
      class: edge_ai_mass.modules.detection.yolo_detector.YOLODetector
      params:
        model_path: models/weights/yolo-seg-best.pt
        task: segment
        conf_threshold: 0.30
        iou_threshold: 0.45
        img_size: 480  # smaller for speed
    fallback:
      class: edge_ai_mass.modules.detection.mobilenet_detector.MobileNetDetector
      params:
        conf_threshold: 0.35

  depth:
    latency_budget_ms: 80
    primary:
      class: edge_ai_mass.modules.depth.depth_anything.DepthAnythingModule
      params:
        model_name: depth-anything/Depth-Anything-V2-Small-hf
        input_size: 256  # smaller input for Jetson
        cache_dir: ${EDGE_AI_DEPTH_MODEL_CACHE_DIR:models/depth/huggingface}
        debug_outputs: ${EDGE_AI_DEPTH_DEBUG_OUTPUTS:false}
        debug_dir: ${EDGE_AI_DEPTH_DEBUG_DIR:models/debug/depth}
    fallback:
      class: edge_ai_mass.modules.depth.depth_anything.MiDaSDepthModule
      params:
        model_type: MiDaS_small
        torch_hub_dir: ${EDGE_AI_TORCH_HUB_DIR:models/torch/hub}
        debug_outputs: ${EDGE_AI_DEPTH_DEBUG_OUTPUTS:false}
        debug_dir: ${EDGE_AI_DEPTH_DEBUG_DIR:models/debug/depth}

  mass:
    latency_budget_ms: 30
    primary:
      class: edge_ai_mass.modules.mass.residual_estimator.ResidualMassEstimator
      params:
        model_path: ${EDGE_AI_MASS_MODEL_PATH:models/weights/mass_residual_best_model.joblib}
        require_model: true
        clamp_nonnegative_mass: true
        default_pixel_to_m: ${EDGE_AI_PIXEL_TO_M:0.001}
        default_thickness_m: ${EDGE_AI_DEFAULT_THICKNESS_M:0.01}
        default_background_depth_m: ${EDGE_AI_BACKGROUND_DEPTH_M:1.0}
        runtime_label_confidence: 1.0
        baseline_method: volume_density
        class_to_material:
          plastic_battle: plastic
          plastic_bottle: plastic
          rigid_plastic: plastic
          plastic_bag: plastic
          metal_can: metal
          glass: glass
          paper_cardboard: cardboard
          organic_waste: organic
          mixed_waste: other
          textile_trash: textile
          vegetation: organic
        density_priors_kg_m3:
          plastic: 40.0
          glass: 300.0
          metal: 160.0
          paper: 90.0
          cardboard: 60.0
          organic: 500.0
          textile: 120.0
          wood: 250.0
          other: 100.0
        hollow_priors:
          plastic_battle: 1.0
          plastic_bottle: 1.0
          rigid_plastic: 0.4
          plastic_bag: 0.4
          metal_can: 1.0
          glass: 0.7
          paper_cardboard: 0.2
          organic_waste: 0.0
          mixed_waste: 0.5
          textile_trash: 0.5
          vegetation: 0.0
    fallback:
      class: edge_ai_mass.modules.mass.density_estimator.DensityMassEstimator
      params:
        class_to_material:
          plastic_battle: plastic
          plastic_bottle: plastic
          rigid_plastic: plastic
          plastic_bag: plastic
          metal_can: metal
          glass: glass
          paper_cardboard: cardboard
          organic_waste: organic
          mixed_waste: other
          textile_trash: textile
          vegetation: organic
        densities:
          plastic: 40.0
          glass: 300.0
          metal: 160.0
          paper: 90.0
          cardboard: 60.0
          organic: 500.0
          textile: 120.0
          wood: 250.0
          other: 100.0
